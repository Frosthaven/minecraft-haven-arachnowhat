modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Arachnophobia mode, client only: spiders look and sound like Mecha Raccoons, with every spider
behavior animated. Covers the Spider, the Cave Spider and, when Iron's Spells 'n Spellbooks is installed, its Ice Spider.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# Optional. Load after it so our Ice Spider renderer replaces its renderer.
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
