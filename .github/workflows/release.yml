# On every push to main that changes the mod: an immutable versioned release (v<mod_version>-<sha7>, the jar, for the
# Haven pack to pin by hash with `just bump-mod haven-arachnowhat`) and the rolling "latest" release (linked from the README).
name: release
on:
  push:
    branches: [main]
    paths: [src/**, build.gradle, gradle.properties, settings.gradle, gradle/**, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew --no-daemon build
      - run: mkdir dist && cp build/libs/haven-arachnowhat-*.jar dist/haven-arachnowhat.jar
      - name: Replace the latest release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/haven-arachnowhat.jar --title "haven-arachnowhat (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Install: drop haven-arachnowhat.jar into your instance's mods folder (see the README)." --latest
      - name: Create the versioned release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ver="$(grep "^mod_version=" gradle.properties | cut -d= -f2)"
          tag="v${ver}-${GITHUB_SHA::7}"
          gh release create "$tag" dist/haven-arachnowhat.jar \
            --target "$GITHUB_SHA" --title "haven-arachnowhat ${ver} (${GITHUB_SHA::7})" \
            --notes "Immutable build of ${GITHUB_SHA::7}, for pinning by hash (the Haven pack). The README links the rolling 'latest'." \
            --latest=false
