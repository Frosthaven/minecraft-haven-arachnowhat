# Publishes haven-arachnawhat.jar as the "latest" release on every push to main that changes the mod.
name: release
on:
  push:
    branches: [main]
    paths: [src/**, build.gradle, gradle.properties, settings.gradle, gradle/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew --no-daemon build
      - run: mkdir dist && cp build/libs/haven-arachnawhat-*.jar dist/haven-arachnawhat.jar
      - name: Replace the latest release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/haven-arachnawhat.jar --title "haven-arachnawhat (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Install: drop haven-arachnawhat.jar into your instance's mods folder (see the README)." --latest
